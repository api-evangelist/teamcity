naftiko: 1.0.0-alpha2
info:
  label: TeamCity REST API — Build Queue
  description: 'TeamCity REST API — Build Queue. 2 operations. Lead operation: Get Build Queue. Self-contained Naftiko capability
    covering one Teamcity business surface.'
  tags:
  - Teamcity
  - Build Queue
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TEAMCITY_API_KEY: TEAMCITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-build-queue
    baseUri: https://{server}/app/rest
    description: TeamCity REST API — Build Queue business capability. Self-contained, no shared references.
    resources:
    - name: buildQueue
      path: /buildQueue
      operations:
      - name: getbuildqueue
        method: GET
        description: Get Build Queue
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: triggerbuild
        method: POST
        description: Trigger Build
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TEAMCITY_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-build-queue-rest
    port: 8080
    description: REST adapter for TeamCity REST API — Build Queue. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/buildqueue
      name: buildqueue
      description: REST surface for buildQueue.
      operations:
      - method: GET
        name: getbuildqueue
        description: Get Build Queue
        call: rest-build-queue.getbuildqueue
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: triggerbuild
        description: Trigger Build
        call: rest-build-queue.triggerbuild
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-build-queue-mcp
    port: 9090
    transport: http
    description: MCP adapter for TeamCity REST API — Build Queue. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-build-queue
      description: Get Build Queue
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-build-queue.getbuildqueue
      outputParameters:
      - type: object
        mapping: $.
    - name: trigger-build
      description: Trigger Build
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-build-queue.triggerbuild
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
