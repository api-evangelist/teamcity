naftiko: 1.0.0-alpha2
info:
  label: TeamCity REST API — Server
  description: 'TeamCity REST API — Server. 2 operations. Lead operation: Get Server Info. Self-contained Naftiko capability
    covering one Teamcity business surface.'
  tags:
  - Teamcity
  - Server
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TEAMCITY_API_KEY: TEAMCITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-server
    baseUri: https://{server}/app/rest
    description: TeamCity REST API — Server business capability. Self-contained, no shared references.
    resources:
    - name: server
      path: /server
      operations:
      - name: getserverinfo
        method: GET
        description: Get Server Info
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: server-plugins
      path: /server/plugins
      operations:
      - name: getserverplugins
        method: GET
        description: Get Server Plugins
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.TEAMCITY_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-server-rest
    port: 8080
    description: REST adapter for TeamCity REST API — Server. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/server
      name: server
      description: REST surface for server.
      operations:
      - method: GET
        name: getserverinfo
        description: Get Server Info
        call: rest-server.getserverinfo
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/server/plugins
      name: server-plugins
      description: REST surface for server-plugins.
      operations:
      - method: GET
        name: getserverplugins
        description: Get Server Plugins
        call: rest-server.getserverplugins
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-server-mcp
    port: 9090
    transport: http
    description: MCP adapter for TeamCity REST API — Server. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-server-info
      description: Get Server Info
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-server.getserverinfo
      outputParameters:
      - type: object
        mapping: $.
    - name: get-server-plugins
      description: Get Server Plugins
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-server.getserverplugins
      outputParameters:
      - type: object
        mapping: $.
