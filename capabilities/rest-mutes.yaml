naftiko: 1.0.0-alpha2
info:
  label: TeamCity REST API — Mutes
  description: 'TeamCity REST API — Mutes. 2 operations. Lead operation: Get All Mutes. Self-contained Naftiko capability
    covering one Teamcity business surface.'
  tags:
  - Teamcity
  - Mutes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TEAMCITY_API_KEY: TEAMCITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-mutes
    baseUri: https://{server}/app/rest
    description: TeamCity REST API — Mutes business capability. Self-contained, no shared references.
    resources:
    - name: mutes
      path: /mutes
      operations:
      - name: getallmutes
        method: GET
        description: Get All Mutes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createmute
        method: POST
        description: Create Mute
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TEAMCITY_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-mutes-rest
    port: 8080
    description: REST adapter for TeamCity REST API — Mutes. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/mutes
      name: mutes
      description: REST surface for mutes.
      operations:
      - method: GET
        name: getallmutes
        description: Get All Mutes
        call: rest-mutes.getallmutes
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createmute
        description: Create Mute
        call: rest-mutes.createmute
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-mutes-mcp
    port: 9090
    transport: http
    description: MCP adapter for TeamCity REST API — Mutes. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-all-mutes
      description: Get All Mutes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-mutes.getallmutes
      outputParameters:
      - type: object
        mapping: $.
    - name: create-mute
      description: Create Mute
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-mutes.createmute
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
