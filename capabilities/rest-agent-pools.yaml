    resources:
    - name: agentPools
      path: /agentPools
      operations:
      - name: getallagentpools
        method: GET
        description: Get All Agent Pools
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createagentpool
