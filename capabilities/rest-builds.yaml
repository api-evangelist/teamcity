        - name: buildLocator
          in: path
          type: string
          required: true
      - name: setbuildtags
        method: PUT
        description: Set Build Tags
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: buildLocator
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: builds-buildLocator-testOccurrences
