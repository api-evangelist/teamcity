  description: 'TeamCity REST API — Builds. 9 operations. Lead operation: Get All Builds. Self-contained Naftiko capability
    covering one Teamcity business surface.'
  tags:
  - Teamcity
  - Builds
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
