    description: TeamCity REST API — Builds business capability. Self-contained, no shared references.
    resources:
    - name: builds
      path: /builds
      operations:
      - name: getallbuilds
        method: GET
        description: Get All Builds
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
