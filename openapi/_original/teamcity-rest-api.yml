components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token authentication using access tokens
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication with username and password

  parameters:
    locator:
      name: locator
      in: query
      description: TeamCity locator string to filter results
      schema:
        type: string
    fields:
      name: fields
      in: query
      description: Fields to include in the response (for partial responses)
      schema:
        type: string
    count:
      name: count
      in: query
      description: Maximum number of items to return
      schema:
        type: integer
        default: 100
    start:
      name: start
      in: query
      description: Index of the first item to return (for pagination)
      schema:
        type: integer
        default: 0
    projectLocator:
      name: projectLocator
      in: path
      required: true
      description: Project locator string (e.g., id:MyProject)
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request - invalid input
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: Unauthorized - authentication required
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: Resource not found
      content:
        text/plain:
          schema:
            type: string

  schemas:
    Project:
      type: object
      properties:
        id:
          type: string
          description: Project unique identifier
        name:
          type: string
          description: Project display name
        description:
          type: string
          description: Project description
        href:
          type: string
          description: Relative URL to this project resource
        webUrl:
          type: string
          description: URL to the project in the TeamCity web UI
        parentProjectId:
          type: string
          description: Parent project identifier
        archived:
          type: boolean
          description: Whether the project is archived
        buildTypes:
          $ref: '#/components/schemas/BuildTypes'
        parameters:
          $ref: '#/components/schemas/Properties'
        projects:
          $ref: '#/components/schemas/Projects'

    Projects:
      type: object
      properties:
        count:
          type: integer
        href:
          type: string
        project:
          type: array
          items:
            $ref: '#/components/schemas/Project'

    NewProjectDescription:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Project display name
        id:
          type: string
          description: Project unique identifier
        parentProject:
          type: object
          properties:
            locator:
              type: string
        copyAllAssociatedSettings:
          type: boolean

    BuildType:
      type: object
      properties:
        id:
          type: string
          description: Build configuration unique identifier
        name:
          type: string
          description: Build configuration display name
        description:
          type: string
          description: Build configuration description
        projectName:
          type: string
          description: Name of the parent project
        projectId:
          type: string
          description: ID of the parent project
        href:
          type: string
        webUrl:
          type: string
        paused:
          type: boolean
        parameters:
          $ref: '#/components/schemas/Properties'
        steps:
          $ref: '#/components/schemas/Steps'
        triggers:
          $ref: '#/components/schemas/Triggers'
        settings:
          $ref: '#/components/schemas/Properties'

    BuildTypes:
      type: object
      properties:
        count:
          type: integer
        buildType:
          type: array
          items:
            $ref: '#/components/schemas/BuildType'

    Build:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Build unique identifier
        buildTypeId:
          type: string
          description: Build configuration identifier
        number:
          type: string
          description: Build number
        status:
          type: string
          enum:
            - SUCCESS
            - FAILURE
            - UNKNOWN
          description: Build status
        state:
          type: string
          enum:
            - queued
            - running
            - finished
          description: Build state
        statusText:
          type: string
          description: Build status text
        href:
          type: string
        webUrl:
          type: string
        branchName:
          type: string
          description: Branch name for the build
        startDate:
          type: string
          description: Build start date
        finishDate:
          type: string
          description: Build finish date
        queuedDate:
          type: string
          description: Date the build was queued
        triggered:
          $ref: '#/components/schemas/TriggeredBy'
        lastChanges:
          $ref: '#/components/schemas/Changes'
        agent:
          $ref: '#/components/schemas/Agent'
        testOccurrences:
          $ref: '#/components/schemas/TestOccurrences'
        problemOccurrences:
          $ref: '#/components/schemas/ProblemOccurrences'
        artifacts:
          $ref: '#/components/schemas/Files'
        properties:
          $ref: '#/components/schemas/Properties'
        statistics:
          $ref: '#/components/schemas/Properties'
        buildType:
          $ref: '#/components/schemas/BuildType'

    Builds:
